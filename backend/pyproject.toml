[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-life-ai-backend"
version = "1.0.0"
description = "Beyond Life AI - Multimodal Persona Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "celery>=5.3.4",
    "openai>=1.12.0",
    "pinecone-client>=2.2.4",
    "langchain>=0.1.16",
    "langchain-openai>=0.0.6",
    "langchain-community>=0.0.28",
    "faiss-cpu>=1.7.4",
    "boto3>=1.34.14",
    "httpx>=0.26.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.1",
    "python-dateutil>=2.8.2",
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.3",
    "tenacity>=8.2.3",
    "python-magic>=0.4.27",
    "ffmpeg-python>=0.2.0",
    "torch>=2.1.2",
    "transformers>=4.36.2",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.3",
    "pillow>=10.2.0",
    "face-recognition>=1.3.0",
    "rembg>=2.0.56",
    "loguru>=0.7.2",
    "structlog>=24.1.0",
    "sentry-sdk>=1.39.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
start = "app.main:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
